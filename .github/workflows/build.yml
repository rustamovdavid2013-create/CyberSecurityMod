name: Build Forge Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание твоего кода
        uses: actions/checkout@v4

      - name: Скачивание шаблона Forge
        uses: actions/checkout@v4
        with:
          repository: MinecraftForge/MinecraftForge
          ref: 1.20.x
          path: temp_forge

      - name: Копирование файлов MDK
        run: |
          cp -rn temp_forge/mdk/* .
          rm -rf temp_forge

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Выдача прав на запуск Gradle
        run: chmod +x gradlew

      - name: Сборка мода (.jar)
        run: ./gradlew build

      - name: Загрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: CyberSecurityMod-1.20.1
          path: build/libs/*.jar
