name: Build Forge Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание твоего кода
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Установка Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Сборка мода (.jar)
        run: gradle build

      - name: Загрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: CyberSecurityMod-1.20.1
          path: build/libs/*.jar
