name: Build Forge Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание твоего кода
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Загрузка официального MDK из GitHub Forge
        run: |
          git clone --depth 1 --branch 1.20.x https://github.com temp_forge
          cp -rn temp_forge/mdk/* .
          cp -rn temp_forge/mdk/.gitignore . || true
          rm -rf temp_forge

      - name: Выдача прав на запуск Gradle
        run: chmod +x gradlew

      - name: Сборка мода (.jar)
        run: ./gradlew build

      - name: Загрузка готового файла
        uses: actions/upload-artifact@v4
        with:
          name: CyberSecurityMod-1.20.1
          path: build/libs/*.jar


